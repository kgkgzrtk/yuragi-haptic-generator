# Docker Compose for Yuragi Haptic Generator
# Production-ready full stack deployment
# (Compose Spec implicit; the legacy `version` key is deprecated under Compose v2.)

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      target: production
    image: yuragi-haptic-backend:latest
    container_name: yuragi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - CORS_ORIGINS=https://yuragi-haptic.com,https://www.yuragi-haptic.com
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/var/log:rw
      - /dev/snd:/dev/snd:rw  # For audio device access
    devices:
      - /dev/snd:/dev/snd:rw  # Audio device access
    privileged: false
    user: "1001:1001"
    networks:
      - haptic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.yuragi-haptic.com`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"

  # Frontend web service
  frontend:
    build:
      # Repo root context: Dockerfile needs pnpm-lock.yaml + pnpm-workspace.yaml
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    image: yuragi-haptic-frontend:latest
    container_name: yuragi-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8080"
    environment:
      - NODE_ENV=production
    # nginx:alpine symlinks /var/log/nginx/{access,error}.log to stdout/stderr;
    # bind-mounting a host directory there overwrites those symlinks AND requires
    # host perms aligned to nginx uid=101 (previously assumed uid=1001 — drift).
    # Logs are surfaced via the Docker logging driver instead (docker logs / fluentd
    # override in docker-compose.logging.yml).
    networks:
      - haptic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`yuragi-haptic.com`, `www.yuragi-haptic.com`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"

networks:
  haptic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  logs:
    driver: local