name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv venv
        uv pip install -e ".[dev,api]"
        uv pip install httpx

    - name: Lint with black
      working-directory: ./backend
      run: |
        uv run black --check src tests || (uv run black --diff src tests && exit 1)

    - name: Lint with ruff
      working-directory: ./backend
      run: |
        uv run ruff check src tests

    - name: Type check with mypy
      working-directory: ./backend
      run: |
        uv run mypy src --ignore-missing-imports || true

    - name: Test with pytest
      working-directory: ./backend
      run: |
        uv run pytest tests -v --cov=src/haptic_system --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  frontend-lint-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Type check
      working-directory: ./frontend
      run: pnpm type-check

    - name: Lint
      working-directory: ./frontend
      run: pnpm lint

    - name: Build
      working-directory: ./frontend
      run: pnpm build

    - name: Test
      working-directory: ./frontend
      run: pnpm test --run

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
    - uses: actions/checkout@v4

    - name: Validate docker-compose configs
      run: |
        docker compose -f docker-compose.yml config --quiet
        docker compose -f docker-compose.dev.yml config --quiet

    - name: Build backend image
      run: |
        docker build --target production -t yuragi-haptic-backend:ci ./backend

    - name: Build frontend image
      run: |
        docker build --target production -t yuragi-haptic-frontend:ci ./frontend
