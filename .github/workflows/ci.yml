name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv venv
        uv pip install -e ".[dev,api]"
        uv pip install httpx

    - name: Lint with black
      working-directory: ./backend
      run: |
        uv run black --check src tests || (uv run black --diff src tests && exit 1)

    - name: Lint with ruff
      working-directory: ./backend
      run: |
        uv run ruff check src tests

    - name: Type check with mypy
      working-directory: ./backend
      run: |
        uv run mypy src --ignore-missing-imports || true

    - name: Test with pytest
      working-directory: ./backend
      run: |
        uv run pytest tests -v --cov=src/haptic_system --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  frontend-lint-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Single source of truth for pnpm version: frontend/package.json `packageManager` field.
    # Omitting `version` makes action-setup read it from the referenced package.json,
    # keeping CI, Dockerfile, and the workspace lockfile aligned.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Type check
      working-directory: ./frontend
      run: pnpm type-check

    - name: Lint
      working-directory: ./frontend
      run: pnpm lint

    - name: Build
      working-directory: ./frontend
      run: pnpm build

    - name: Test
      working-directory: ./frontend
      run: pnpm test --run

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate docker-compose configs
      run: |
        docker compose -f docker-compose.yml config --quiet
        docker compose -f docker-compose.dev.yml config --quiet

    # Separate cache scopes per image so backend churn doesn't invalidate
    # frontend layers and vice versa. mode=max exports intermediate layers
    # of multi-stage builds for maximum reuse on subsequent runs.
    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        target: production
        tags: yuragi-haptic-backend:ci
        load: true
        cache-from: type=gha,scope=backend
        cache-to: type=gha,scope=backend,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: frontend/Dockerfile
        target: production
        tags: yuragi-haptic-frontend:ci
        load: true
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,scope=frontend,mode=max
